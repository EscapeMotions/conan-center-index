patches:
  "6.8.3":
    - "patch_file": "patches/6.8.3-qdockwidget-presspos.patch"
      "base_path": "qtbase"
      "patch_description": "Expose QDockWidget setPressPos/pressPos to keep a floating dock under the cursor when undocking a resized dock"
    - "patch_file": "patches/6.8.3-qtooltip-tip-placement.patch"
      "base_path": "qtbase"
      "patch_description": "QToolTip: add TipPlacement enum + setTipPlacement() for directional tooltip positioning, and hide tips immediately on Leave/MouseMove"
    - "patch_file": "patches/6.8.3-disable-wintab.patch"
      "base_path": "qtbase"
      "patch_description": "Disable Qt's built-in WinTab (QWindowsTabletSupport) so the app's own WinTab handling takes over on Windows"
    - "patch_file": "patches/6.8.3-qstylesheetstyle-remove-updateobjects-recursion.patch"
      "base_path": "qtbase"
      "patch_description": "QStyleSheetStyle: drop the O(N*depth) updateObjects() recursion (huge repolish cost on DPI/screen change); repolish(QWidget*) enumerates the full subtree itself so per-widget restyles stay correct"
    - "patch_file": "patches/6.8.3-synthesize-enter-leave-for-tablet.patch"
      "base_path": "qtbase"
      "patch_description": "Synthesize Enter/Leave events for accepted QTabletEvents so the system cursor hides correctly when moving the pen from menu panels back to the canvas (macOS)"
    - "patch_file": "patches/remove-linkage-to-agl-framework.patch"
      "base_path": "qtbase"
    - "patch_file": "patches/macos-link-platform-plugin-to-foundation.patch"
      "base_path": "qtbase"
    - "patch_file": "patches/c72097e_6.8.3.diff"
      "base_path": "qtwebengine"
